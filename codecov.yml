# Coverage is reported, never a gate: the SIMD backends only run on the
# matching CI machines, so a change's coverage depends on where it lands.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Wait for the four per-CPU reports before computing totals.
codecov:
  notify:
    after_n_builds: 4

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
  after_n_builds: 4

ignore:
  - "xtask"
  - "tools"
