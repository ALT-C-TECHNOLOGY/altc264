# Coverage is reported, never a gate: the SIMD backends only run on the
# matching CI machines, so a change's coverage depends on where it lands.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true

ignore:
  - "xtask"
  - "tools"
