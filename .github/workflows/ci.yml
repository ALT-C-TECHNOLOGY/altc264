name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-15, name: macos-arm64 }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  scalar:
    name: test (portable SIMD fallback)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg altc_scalar
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p altc264 --release

  wasm:
    name: test (wasm32, SIMD128)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -C target-feature=+simd128
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p altc264 --release --target wasm32-wasip1
      - run: cargo build -p altc264-cli --release --target wasm32-wasip1

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The version as an input, not a tag, so Dependabot leaves the MSRV alone.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p altc264 -p altc264-capi -p altc264-cli

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  conformance:
    name: conformance (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Filled by the nightly workflow; a miss downloads the suites (slow).
      - uses: actions/cache/restore@v6
        id: suites
        with:
          path: work/conformance
          key: conformance-bitstreams-${{ hashFiles('conformance/manifest.json') }}
          restore-keys: conformance-bitstreams-
      - if: steps.suites.outputs.cache-hit != 'true'
        run: cargo xtask conformance --bitstreams-only
      - run: cargo xtask conformance-check --smoke

  # One report per CPU family (each measures the SIMD code built for it);
  # Codecov merges them. Unit tests plus the conformance smoke streams.
  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: x86_64 }
          - { os: ubuntu-24.04-arm, name: aarch64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: ubuntu-24.04, name: scalar, rustflags: "--cfg altc_scalar" }
    name: coverage (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache/restore@v6
        id: suites
        with:
          path: work/conformance
          key: conformance-bitstreams-${{ hashFiles('conformance/manifest.json') }}
          restore-keys: conformance-bitstreams-
      - if: steps.suites.outputs.cache-hit != 'true'
        run: cargo xtask conformance --bitstreams-only
      - run: cargo xtask coverage --lcov lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: ${{ matrix.name }}
          use_oidc: true
          fail_ci_if_error: false
